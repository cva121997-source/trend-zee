name: Trend-Zee D1 migrations

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      D1_DATABASE_NAME: ${{ secrets.TREND_ZEE_D1_DATABASE_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check migration configuration
        run: |
          if [ -z "$D1_DATABASE_NAME" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "D1 migration credentials are not configured; skipping remote migration."
          else
            echo "D1 migration credentials are configured."
          fi
      - uses: actions/checkout@v4
        if: env.D1_DATABASE_NAME != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.D1_DATABASE_NAME != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: env.D1_DATABASE_NAME != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
      - name: Apply D1 migrations
        if: env.D1_DATABASE_NAME != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/apply-d1-migrations.mjs
